#cloud-config
# =============================================================================
# Serve para os dois provedores em jogo neste repo — o mesmo arquivo:
#
#   Hetzner Cloud CX23 (x86, 4 GB) ou CAX11 (ARM64, 4 GB) — Ubuntu 24.04 "noble"
#     Cole o arquivo INTEIRO no console, em "Cloud config", na criação do
#     servidor. Nada aqui depende da arquitetura (o repo do Docker é
#     escolhido por `dpkg --print-architecture`).
#
#   Oracle Cloud VM.Standard.A1.Flex (2 OCPU/12 GB ou 1 OCPU/6 GB) — o loop
#   scripts/criar-instancia.sh passa este arquivo via `--user-data-file`
#   sozinho, sem precisar colar nada.
#
# De um jeito ou de outro, roda uma única vez, no primeiro boot — editar
# aqui depois não muda nada numa instância já criada. O bloco de growfs e o
# de firewall abaixo são inofensivos no provedor onde não fazem falta (ex.:
# a Hetzner já entrega a partição do tamanho certo, então o growpart/resize2fs
# apenas não encontra nada para fazer).
#
# ANTES DE CRIAR O SERVIDOR: o firewall de borda do provedor (Hetzner Cloud
# Firewall ou Security List da OCI) já deve liberar 22/80/443 tcp + 443 udp.
# O bloco de firewall abaixo purga qualquer iptables-persistent da imagem, e
# é o firewall de borda (fora da VM) que cobre a janela de segundos até o
# ufw subir.
# =============================================================================

hostname: srv01
fqdn: srv01
prefer_fqdn_over_hostname: false

# Criado explicitamente aqui para existir ANTES do usuário ser criado.
# Se deixássemos o pacote docker-ce criar o grupo, o usermod abaixo rodaria
# antes da instalação e falharia.
groups:
  - docker

users:
  # O usuário "ubuntu" da imagem do OCI continua existindo, com a chave que
  # você colar no campo "Add SSH keys" do console. É a porta de emergência:
  # no OCI não há console web de recuperação, só o Console Connection serial.
  - default
  - name: matheus
    gecos: Matheus
    groups: [sudo, docker]
    shell: /bin/bash
    sudo: ["ALL=(ALL) NOPASSWD:ALL"]
    lock_passwd: true
    ssh_authorized_keys:
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGRFUfY+0mVkZYN3vkddmu+lCJuiBmwnaD6Vcqmu/uD+ matheus.erick.97@gmail.com

# Desabilita a conta root para login remoto. O usuário acima tem sudo.
disable_root: true

package_update: true
package_upgrade: true

packages:
  - ca-certificates
  - curl
  - gnupg
  - git
  - ufw
  - fail2ban
  - cloud-guest-utils
  - unattended-upgrades
  - restic
  - htop
  - ncdu
  - jq

write_files:
  # ---------------------------------------------------------------------------
  # SSH: só chave, sem root, sem senha.
  # O sshd do Ubuntu já faz Include /etc/ssh/sshd_config.d/*.conf
  # ---------------------------------------------------------------------------
  # Port 2222 além da 22: redes corporativas/de convidados costumam bloquear
  # saída na 22 (sintoma: timeout no ssh com ping ok). Aconteceu no primeiro
  # acesso ao srv01 e exigiu console VNC + reset de senha do root para
  # abrir a porta — melhor já nascer com ela. Liberar também no firewall de
  # borda do provedor.
  - path: /etc/ssh/sshd_config.d/98-porta-alternativa.conf
    permissions: "0644"
    content: |
      Port 22
      Port 2222

  - path: /etc/ssh/sshd_config.d/99-hardening.conf
    permissions: "0644"
    content: |
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PubkeyAuthentication yes
      AuthenticationMethods publickey
      X11Forwarding no
      MaxAuthTries 3
      ClientAliveInterval 300
      ClientAliveCountMax 2

  # ---------------------------------------------------------------------------
  # fail2ban: no Ubuntu 24.04 o sshd loga no journald, não em /var/log/auth.log.
  # Sem "backend = systemd" o jail sobe mas nunca bane ninguém.
  # ---------------------------------------------------------------------------
  - path: /etc/fail2ban/jail.d/sshd.local
    permissions: "0644"
    content: |
      [sshd]
      enabled  = true
      backend  = systemd
      port     = ssh
      maxretry = 5
      findtime = 10m
      bantime  = 1h

  # ---------------------------------------------------------------------------
  # Atualizações de segurança automáticas, sem reboot automático.
  # (Reboot fica manual: você decide quando derrubar os serviços.)
  # ---------------------------------------------------------------------------
  - path: /etc/apt/apt.conf.d/20auto-upgrades
    permissions: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      APT::Periodic::AutocleanInterval "7";

  - path: /etc/apt/apt.conf.d/50unattended-upgrades-local
    permissions: "0644"
    content: |
      Unattended-Upgrade::Automatic-Reboot "false";
      Unattended-Upgrade::Remove-Unused-Kernel-Packages "true";
      Unattended-Upgrade::Remove-Unused-Dependencies "true";

  # ---------------------------------------------------------------------------
  # Com 4 GB o swap não é opcional (com 12 GB na Oracle seria só folga).
  # swappiness baixo para o kernel só recorrer a ele sob pressão real, não
  # por preferência.
  # ---------------------------------------------------------------------------
  - path: /etc/sysctl.d/99-servidor.conf
    permissions: "0644"
    content: |
      vm.swappiness = 10
      vm.vfs_cache_pressure = 50
      net.core.somaxconn = 1024

  # ---------------------------------------------------------------------------
  # Rotação de log do Docker. Sem isso, um container tagarela enche o disco
  # e o servidor para de responder.
  # ---------------------------------------------------------------------------
  - path: /etc/docker/daemon.json
    permissions: "0644"
    content: |
      {
        "log-driver": "json-file",
        "log-opts": {
          "max-size": "10m",
          "max-file": "3"
        },
        "live-restore": true
      }

runcmd:
  # --- Expande o filesystem para o tamanho real do boot volume --------------
  # Específico do OCI: o boot volume de 100 GB não é enxergado pelo filesystem
  # automaticamente. Sem isto, `df -h /` mostra ~45 GB.
  #
  # O oci-growfs só existe nas imagens que trazem o oci-utils. O fallback com
  # growpart + resize2fs funciona em qualquer Ubuntu e é idempotente: se a
  # partição já ocupa o disco, os dois comandos saem sem fazer nada.
  - |
    set -x
    if [ -x /usr/libexec/oci-growfs ]; then
      /usr/libexec/oci-growfs -y
    else
      ROOT_SRC="$(findmnt -no SOURCE /)"
      DISCO="$(lsblk -no PKNAME "$ROOT_SRC" | tr -d ' ')"
      PART="$(echo "$ROOT_SRC" | grep -o '[0-9]*$')"
      if [ -n "$DISCO" ] && [ -n "$PART" ]; then
        growpart "/dev/$DISCO" "$PART" || true
        resize2fs "$ROOT_SRC" || true
      fi
    fi
    df -h /

  # --- Firewall, parte 1: remover o iptables da imagem da Oracle -------------
  # A imagem Ubuntu do OCI vem com iptables-persistent aplicando REJECT em
  # tudo menos 22, e a Oracle desabilita o ufw para não conflitar com isso.
  # Manter as duas ferramentas significa lembrar das duas para sempre.
  # Decisão do setup: uma camada só na VM (ufw), e a Security List do VCN
  # como a defesa real, fora da VM, onde o Docker não alcança.
  #
  # Roda ANTES do Docker de propósito: o flush abaixo apagaria as chains que
  # o Docker cria.
  - |
    set -x
    systemctl stop netfilter-persistent 2>/dev/null || true
    systemctl disable netfilter-persistent 2>/dev/null || true
    DEBIAN_FRONTEND=noninteractive apt-get purge -y netfilter-persistent iptables-persistent || true
    rm -f /etc/iptables/rules.v4 /etc/iptables/rules.v6
    for cmd in iptables ip6tables; do
      $cmd -P INPUT ACCEPT
      $cmd -P FORWARD ACCEPT
      $cmd -P OUTPUT ACCEPT
      $cmd -F
      $cmd -X
    done

  # --- Firewall, parte 2: ufw como camada única na VM ------------------------
  # ATENÇÃO: o Docker escreve regras de iptables direto e IGNORA o ufw.
  # Se algum compose publicar uma porta com `ports:`, ela fica exposta na
  # internet mesmo com o ufw negando. Por isso a Security List do VCN — que
  # roda fora da VM — é a defesa que vale; o ufw aqui é a segunda camada.
  # Regra de ouro do setup: só o Caddy usa `ports:`.
  - |
    set -x
    ufw default deny incoming
    ufw default allow outgoing
    ufw allow 22/tcp comment 'ssh'
    ufw allow 2222/tcp comment 'ssh-alt'
    ufw allow 80/tcp comment 'http'
    ufw allow 443/tcp comment 'https'
    ufw allow 443/udp comment 'http3'
    ufw --force enable

  # --- swap de 2 GB ---------------------------------------------------------
  - |
    set -x
    if [ ! -f /swapfile ]; then
      fallocate -l 2G /swapfile
      chmod 600 /swapfile
      mkswap /swapfile
      swapon /swapfile
      echo '/swapfile none swap sw 0 0' >> /etc/fstab
    fi
    sysctl --system

  # --- Docker Engine + Compose plugin (repositório oficial) -----------------
  # Não use o docker.io do Ubuntu nem snap: versões velhas e o plugin
  # compose v2 não vem junto.
  - |
    set -x
    install -m 0755 -d /etc/apt/keyrings
    curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
    chmod a+r /etc/apt/keyrings/docker.asc
    echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo "$VERSION_CODENAME") stable" > /etc/apt/sources.list.d/docker.list
    apt-get update
    DEBIAN_FRONTEND=noninteractive apt-get install -y \
      docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
    usermod -aG docker matheus
    systemctl enable --now docker

  # --- Redes Docker compartilhadas ------------------------------------------
  # "edge"  = tudo que o Caddy precisa alcançar (apps web)
  # "data"  = tudo que fala com o Postgres (apps + workers)
  # Separar as duas significa que um bot sem porta HTTP nunca fica alcançável
  # pelo proxy, e que o Postgres nunca é visível na rede do proxy.
  - |
    set -x
    docker network create edge 2>/dev/null || true
    docker network create data 2>/dev/null || true

  # --- Diretório dos stacks --------------------------------------------------
  - |
    set -x
    mkdir -p /opt/stacks /var/backups/postgres
    chown -R matheus:matheus /opt/stacks
    chmod 700 /var/backups/postgres

  # --- Aplica SSH e fail2ban -------------------------------------------------
  # daemon-reload: no Ubuntu 24.04 o sshd é ativado por socket, e é um
  # generator do systemd que lê os `Port` do sshd_config — sem isso a 2222
  # não abre.
  - systemctl daemon-reload
  - systemctl restart ssh.socket ssh
  - systemctl enable --now fail2ban

final_message: "Servidor pronto em $UPTIME segundos. Suba os stacks em /opt/stacks."
